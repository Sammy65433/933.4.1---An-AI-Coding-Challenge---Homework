<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashcards Study App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 text-slate-800 dark:from-slate-900 dark:via-slate-900 dark:to-slate-800 dark:text-slate-100">
  <header class="sticky top-0 z-10 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-bold flex items-center gap-2">📚 Flashcards</h1>
      <div class="flex gap-2 flex-wrap">
        <button id="newDeckBtn" class="px-3 py-1.5 rounded-lg bg-white/20 hover:bg-white/30 border border-white/30 text-sm font-medium transition">➕ New Deck</button>
        <button id="importBtn" class="px-3 py-1.5 rounded-lg bg-white/20 hover:bg-white/30 border border-white/30 text-sm font-medium transition">📥 Import</button>
        <button id="exportBtn" class="px-3 py-1.5 rounded-lg bg-white/20 hover:bg-white/30 border border-white/30 text-sm font-medium transition">📤 Export</button>
      <button id="sampleBtn" class="px-3 py-1.5 rounded-lg bg-white/20 hover:bg-white/30 border border-white/30 text-sm font-medium transition">🧪 Sample</button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-[260px_1fr] gap-4">
    <nav class="bg-white/80 dark:bg-slate-800/80 backdrop-blur rounded-2xl shadow p-4 md:sticky md:top-20 h-fit" aria-label="Decks">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2">🗂️ Decks</h2>
      <ul id="deckList" class="flex flex-col gap-1.5"></ul>
      <p id="noDecks" class="text-center text-slate-500 dark:text-slate-400 text-sm py-4">📭 No decks yet. Create one!</p>
    </nav>

    <main class="bg-white/80 dark:bg-slate-800/80 backdrop-blur rounded-2xl shadow p-5">
      <section>
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h2 id="deckTitle" class="text-xl font-semibold">Select a deck</h2>
          <div class="flex gap-2 flex-wrap">
            <button id="editDeckBtn" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm hidden">✏️ Edit Deck</button>
            <button id="deleteDeckBtn" class="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200 dark:bg-rose-900/40 dark:text-rose-300 text-sm hidden">🗑️ Delete Deck</button>
            <button id="manageCardsBtn" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm hidden">📋 Manage Cards</button>
          </div>
        </div>

        <div class="mt-4 flex flex-wrap gap-2 items-center">
          <input id="searchInput" type="search" placeholder="🔍 Search cards..." aria-label="Search cards in active deck"
            class="flex-1 min-w-[180px] px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button id="shuffleBtn" class="px-3 py-2 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 dark:bg-amber-900/40 dark:text-amber-300 text-sm hidden">🔀 Shuffle</button>
          <button id="newCardBtn" class="px-3 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 text-sm hidden">➕ New Card</button>
        </div>

        <div id="studyArea" class="mt-6 flex flex-col items-center gap-4 hidden">
          <div class="card-container">
            <div id="studyCard" class="card" tabindex="0" role="button" aria-label="Flashcard. Press Space to flip.">
              <div class="card-face card-front"><p id="cardFront"></p></div>
              <div class="card-face card-back"><p id="cardBack"></p></div>
            </div>
          </div>
          <div class="flex gap-4 text-sm text-slate-500 dark:text-slate-400 flex-wrap justify-center">
            <span id="cardCounter" aria-live="polite"></span>
            <span id="searchCount"></span>
          </div>
          <div class="flex gap-2 flex-wrap justify-center">
            <button id="prevBtn" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600">⬅️ Previous</button>
            <button id="flipBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">🔄 Flip</button>
            <button id="nextBtn" class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600">Next ➡️</button>
          </div>
          <div class="flex gap-2 items-center flex-wrap justify-center" id="ratingControls">
            <span class="text-sm text-slate-500 dark:text-slate-400">Rate:</span>
            <button type="button" data-rating="again" class="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-700 hover:bg-rose-200 dark:bg-rose-900/40 dark:text-rose-300 text-sm">🔁 Again</button>
            <button type="button" data-rating="good" class="px-3 py-1.5 rounded-lg bg-emerald-100 text-emerald-700 hover:bg-emerald-200 dark:bg-emerald-900/40 dark:text-emerald-300 text-sm">✅ Good</button>
            <button type="button" data-rating="easy" class="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 dark:bg-amber-900/40 dark:text-amber-300 text-sm">⭐ Easy</button>
          </div>
        </div>

        <div id="emptyCards" class="mt-6 text-center text-slate-500 dark:text-slate-400 hidden">📭 No cards in this deck. Add one!</div>
      </section>
    </main>
  </div>

  <footer class="text-center py-3 text-sm text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-800/60 mt-4">
    ⌨️ Shortcuts: Space flip, ←/→ navigate, Enter submit, Esc close.
  </footer>

  <div id="modalBackdrop" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

  <div id="deckModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="deckModalTitle">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-md p-5">
      <h3 id="deckModalTitle" class="text-lg font-semibold mb-3">New Deck</h3>
      <form id="deckForm">
        <label for="deckNameInput" class="block text-sm font-medium mb-1">Deck name</label>
        <input id="deckNameInput" type="text" required autocomplete="off"
          class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <div class="mt-4 flex justify-end gap-2">
          <button type="button" data-close class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm">❌ Cancel</button>
          <button type="submit" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 text-sm">✅ Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="cardModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-md p-5">
      <h3 id="cardModalTitle" class="text-lg font-semibold mb-3">New Card</h3>
      <form id="cardForm">
        <label for="cardFrontInput" class="block text-sm font-medium mb-1">Front</label>
        <textarea id="cardFrontInput" required rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <label for="cardBackInput" class="block text-sm font-medium mb-1 mt-3">Back</label>
        <textarea id="cardBackInput" required rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <div class="mt-4 flex justify-end gap-2">
          <button type="button" data-close class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm">❌ Cancel</button>
          <button type="submit" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 text-sm">✅ Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="manageModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="manageModalTitle">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-2xl p-5">
      <h3 id="manageModalTitle" class="text-lg font-semibold mb-3">📋 Manage Cards</h3>
      <ul id="manageCardList" class="flex flex-col gap-2 max-h-[50vh] overflow-auto"></ul>
      <div class="mt-4 flex justify-end">
        <button type="button" data-close class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm">✖️ Close</button>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-md p-5">
      <h3 id="confirmTitle" class="text-lg font-semibold mb-2">Confirm</h3>
      <p id="confirmMessage" class="text-slate-600 dark:text-slate-300"></p>
      <div class="mt-4 flex justify-end gap-2">
        <button type="button" id="confirmCancel" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm">❌ Cancel</button>
        <button type="button" id="confirmOk" class="px-3 py-1.5 rounded-lg bg-rose-600 text-white hover:bg-rose-700 text-sm">🗑️ Delete</button>
      </div>
    </div>
  </div>

  <div id="importModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-md p-5">
      <h3 id="importTitle" class="text-lg font-semibold mb-3">📥 Import Deck JSON</h3>
      <textarea id="importText" rows="8" placeholder='{"name":"My Deck","cards":[{"front":"Q","back":"A"}]}'
        class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
      <div class="mt-4 flex justify-end gap-2">
        <button type="button" data-close class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-sm">❌ Cancel</button>
        <button type="button" id="importOk" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 text-sm">📥 Import</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
